<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="482" viewBox="0 0 1200 482" role="img" aria-label="Terminal: whoami, focus, what I am building">
<title>Terminal: whoami, focus, what I am building</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards;}
.fi{opacity:0;animation:fadeIn .9s ease-out forwards;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center;}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<defs><clipPath id="c"><rect width="1200" height="482" rx="20"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="1200" height="482" fill="#0d1526"/>
<rect width="1200" height="54" fill="#ffffff" fill-opacity=".05"/>
<circle cx="32" cy="27" r="8" fill="#ff5f57"/><circle cx="58" cy="27" r="8" fill="#febc2e"/><circle cx="84" cy="27" r="8" fill="#28c840"/>
<text x="600" y="33" text-anchor="middle" font-size="16" fill="#94a3b8" class="mono">umer@bytefinch: ~</text>
<text x="40" y="96" font-size="19" class="mono fi" style="animation-delay:0.10s;animation-duration:.2s" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">➜</tspan><tspan fill="#60a5fa" font-weight="700">  ~</tspan><tspan fill="#f1f5f9"> whoami</tspan></text><rect x="85" y="72" width="104" height="34" fill="#0d1526" class="cover" style="animation:uncover 0.36s steps(8) 0.40s forwards"/><text x="40" y="134" font-size="19" class="mono fi" style="animation-delay:1.01s;animation-duration:.4s" xml:space="preserve"><tspan fill="#f1f5f9">Syed Umer Shah</tspan><tspan fill="#94a3b8"> · founder of </tspan><tspan fill="#60a5fa">ByteFinch Technologies</tspan><tspan fill="#94a3b8"> · Lahore, PK</tspan></text><text x="40" y="172" font-size="19" class="mono fi" style="animation-delay:1.01s;animation-duration:.2s" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">➜</tspan><tspan fill="#60a5fa" font-weight="700">  ~</tspan><tspan fill="#f1f5f9"> cat ./focus.txt</tspan></text><rect x="85" y="148" width="204" height="34" fill="#0d1526" class="cover" style="animation:uncover 0.77s steps(17) 1.31s forwards"/><text x="40" y="210" font-size="19" class="mono fi" style="animation-delay:2.33s;animation-duration:.4s" xml:space="preserve"><tspan fill="#f1f5f9">Full-stack engineer. </tspan><tspan fill="#fbbf24">7 years</tspan><tspan fill="#94a3b8"> of Node.js and TypeScript, </tspan><tspan fill="#fbbf24">6 years</tspan><tspan fill="#94a3b8"> of React.</tspan></text><text x="40" y="248" font-size="19" class="mono fi" style="animation-delay:2.62s;animation-duration:.4s" xml:space="preserve"><tspan fill="#94a3b8">I design the system, write the code, and own it in production.</tspan></text><text x="40" y="286" font-size="19" class="mono fi" style="animation-delay:2.62s;animation-duration:.2s" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">➜</tspan><tspan fill="#60a5fa" font-weight="700">  ~</tspan><tspan fill="#f1f5f9"> ls ./building</tspan></text><rect x="85" y="262" width="182" height="34" fill="#0d1526" class="cover" style="animation:uncover 0.67s steps(15) 2.92s forwards"/><text x="40" y="324" font-size="19" class="mono fi" style="animation-delay:3.85s;animation-duration:.4s" xml:space="preserve"><tspan fill="#60a5fa">payroll-engine/</tspan><tspan fill="#94a3b8">   </tspan><tspan fill="#4ade80">secretveil/</tspan><tspan fill="#94a3b8">   </tspan><tspan fill="#60a5fa">edge-saas-starter/</tspan><tspan fill="#94a3b8">   </tspan><tspan fill="#c4b5fd">ai-agents/</tspan></text><text x="40" y="362" font-size="19" class="mono fi" style="animation-delay:3.85s;animation-duration:.2s" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">➜</tspan><tspan fill="#60a5fa" font-weight="700">  ~</tspan><tspan fill="#f1f5f9"> echo $MOTTO</tspan></text><rect x="85" y="338" width="160" height="34" fill="#0d1526" class="cover" style="animation:uncover 0.58s steps(13) 4.15s forwards"/><text x="40" y="400" font-size="19" class="mono fi" style="animation-delay:4.98s;animation-duration:.4s" xml:space="preserve"><tspan fill="#fbbf24">Small bytes. Big builds.</tspan></text><text x="40" y="438" font-size="19" class="mono fi" style="animation-delay:5.28s"><tspan fill="#4ade80" font-weight="700">➜</tspan><tspan fill="#60a5fa" font-weight="700">  ~</tspan></text><rect x="96" y="420" width="11" height="22" fill="#f1f5f9" opacity="0" style="animation:blink 1.1s step-end 5.28s infinite"/></g></svg>
