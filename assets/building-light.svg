<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="424" viewBox="0 0 1200 424" role="img" aria-label="What I am building: a payroll engine, SecretVeil, an edge SaaS starter and AI agents">
<title>What I am building: a payroll engine, SecretVeil, an edge SaaS starter and AI agents</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards;}
.fi{opacity:0;animation:fadeIn .9s ease-out forwards;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center;}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<g class="fu" style="animation-delay:0.10s"><rect x="1" y="1" width="586" height="198" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="28" y="1" width="120" height="4" rx="2" fill="#f59e0b"/><rect x="28" y="30" width="64" height="64" rx="16" fill="#f59e0b" fill-opacity="0.10"/><rect x="28" y="30" width="64" height="64" rx="16" fill="none" stroke="#f59e0b" stroke-opacity=".6" style="animation:pulse 3s ease-in-out 0.0s infinite"/><g transform="translate(28,30)" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="12" width="28" height="40" rx="4"/><path d="M24 22h16M24 30h16M24 38h9"/><path d="M36 42l4 4 8-9" stroke-width="3.2"/></g><text x="112" y="70" font-size="27" font-weight="800" fill="#1a2a4a">Payroll for UAE agencies</text><text x="28" y="134" font-size="19" fill="#475569">Salary runs, WPS SIF files and multi-tenant HR</text><text x="28" y="162" font-size="19" fill="#475569">for staffing agencies, with golden-file tests.</text><g><rect x="432" y="144" width="128" height="28" rx="14.0" fill="none" fill-opacity="0" stroke="#f59e0b" stroke-width="1.5"/><rect x="432" y="144" width="128" height="28" rx="14.0" fill="#f59e0b" fill-opacity="0.12"/><text x="496.0" y="162.7" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b">PRIVATE BUILD</text></g></g><g class="fu" style="animation-delay:0.28s"><rect x="613" y="1" width="586" height="198" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="640" y="1" width="120" height="4" rx="2" fill="#16a34a"/><rect x="640" y="30" width="64" height="64" rx="16" fill="#16a34a" fill-opacity="0.10"/><rect x="640" y="30" width="64" height="64" rx="16" fill="none" stroke="#16a34a" stroke-opacity=".6" style="animation:pulse 3s ease-in-out 0.6s infinite"/><g transform="translate(640,30)" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 10l18 7v13c0 12-8 20-18 24-10-4-18-12-18-24V17z"/><circle cx="32" cy="29" r="4"/><path d="M32 33v8"/></g><text x="724" y="70" font-size="27" font-weight="800" fill="#1a2a4a">SecretVeil</text><text x="640" y="134" font-size="19" fill="#475569">Lets an AI coding agent work in your repo</text><text x="640" y="162" font-size="19" fill="#475569">without reading your secrets.</text><g><rect x="1060" y="144" width="112" height="28" rx="14.0" fill="none" fill-opacity="0" stroke="#16a34a" stroke-width="1.5"/><rect x="1060" y="144" width="112" height="28" rx="14.0" fill="#16a34a" fill-opacity="0.12"/><text x="1116.0" y="162.7" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">OPEN SOURCE</text></g></g><g class="fu" style="animation-delay:0.46s"><rect x="1" y="225" width="586" height="198" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="28" y="225" width="120" height="4" rx="2" fill="#2563eb"/><rect x="28" y="254" width="64" height="64" rx="16" fill="#2563eb" fill-opacity="0.10"/><rect x="28" y="254" width="64" height="64" rx="16" fill="none" stroke="#2563eb" stroke-opacity=".6" style="animation:pulse 3s ease-in-out 1.2s infinite"/><g transform="translate(28,254)" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M35 8L17 36h14l-3 20 19-29H33z"/></g><text x="112" y="294" font-size="27" font-weight="800" fill="#1a2a4a">Edge SaaS starter</text><text x="28" y="358" font-size="19" fill="#475569">Next.js 16 on Cloudflare Workers with D1, R2,</text><text x="28" y="386" font-size="19" fill="#475569">Better Auth, Resend and Stripe.</text><g><rect x="470" y="368" width="90" height="28" rx="14.0" fill="none" fill-opacity="0" stroke="#2563eb" stroke-width="1.5"/><rect x="470" y="368" width="90" height="28" rx="14.0" fill="#2563eb" fill-opacity="0.12"/><text x="515.0" y="386.7" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">TEMPLATE</text></g></g><g class="fu" style="animation-delay:0.64s"><rect x="613" y="225" width="586" height="198" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="640" y="225" width="120" height="4" rx="2" fill="#7c3aed"/><rect x="640" y="254" width="64" height="64" rx="16" fill="#7c3aed" fill-opacity="0.10"/><rect x="640" y="254" width="64" height="64" rx="16" fill="none" stroke="#7c3aed" stroke-opacity=".6" style="animation:pulse 3s ease-in-out 1.8s infinite"/><g transform="translate(640,254)" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="20" width="36" height="28" rx="8"/><circle cx="25" cy="34" r="3.5"/><circle cx="39" cy="34" r="3.5"/><path d="M32 20v-8M28 12h8M9 30v8M55 30v8"/></g><text x="724" y="294" font-size="27" font-weight="800" fill="#1a2a4a">AI agents and automation</text><text x="640" y="358" font-size="19" fill="#475569">LangGraph agents, MCP servers and n8n</text><text x="640" y="386" font-size="19" fill="#475569">workflows, like an AI sales chatbot.</text><g><rect x="1097" y="368" width="75" height="28" rx="14.0" fill="none" fill-opacity="0" stroke="#7c3aed" stroke-width="1.5"/><rect x="1097" y="368" width="75" height="28" rx="14.0" fill="#7c3aed" fill-opacity="0.12"/><text x="1134.5" y="386.7" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">ACTIVE</text></g></g></svg>
