<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Journey: FAST-NUCES, Focusteck 2019, freelance 2020, Codefinity 2023, founded ByteFinch 2026">
<title>Journey: FAST-NUCES, Focusteck 2019, freelance 2020, Codefinity 2023, founded ByteFinch 2026</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards;}
.fi{opacity:0;animation:fadeIn .9s ease-out forwards;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center;}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<defs><linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="288" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<line x1="120" y1="140" x2="1080" y2="140" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
<line x1="120" y1="140" x2="1080" y2="140" stroke="url(#tl)" stroke-width="6" stroke-linecap="round" stroke-dasharray="962" stroke-dashoffset="962" style="animation:draw 2.4s cubic-bezier(.4,0,.2,1) .2s forwards"/>
<g class="fu" style="animation-delay:0.20s"><circle cx="120" cy="140" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><circle cx="120" cy="140" r="6" fill="#2563eb"/><text x="120" y="100" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="2" fill="#64748b">EDUCATION</text><text x="120" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2a4a">FAST-NUCES</text><text x="120" y="228" text-anchor="middle" font-size="16" fill="#475569">Computer Science</text></g><g class="fu" style="animation-delay:0.75s"><circle cx="360" cy="140" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><circle cx="360" cy="140" r="6" fill="#2563eb"/><text x="360" y="100" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0" fill="#2563eb">2019</text><text x="360" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2a4a">Focusteck</text><text x="360" y="228" text-anchor="middle" font-size="16" fill="#475569">Software engineering</text></g><g class="fu" style="animation-delay:1.30s"><circle cx="600" cy="140" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><circle cx="600" cy="140" r="6" fill="#2563eb"/><text x="600" y="100" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0" fill="#2563eb">2020</text><text x="600" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2a4a">Fiverr and Upwork</text><text x="600" y="228" text-anchor="middle" font-size="16" fill="#475569">Freelance clients</text></g><g class="fu" style="animation-delay:1.85s"><circle cx="840" cy="140" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="4"/><circle cx="840" cy="140" r="6" fill="#2563eb"/><text x="840" y="100" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0" fill="#2563eb">2023</text><text x="840" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2a4a">Codefinity</text><text x="840" y="228" text-anchor="middle" font-size="16" fill="#475569">Director of Engineering</text></g><g class="fu" style="animation-delay:2.40s"><circle cx="1080" cy="140" r="16" fill="none" stroke="#f59e0b" stroke-width="2"><animate attributeName="r" values="14;30" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1080" cy="140" r="15" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/><circle cx="1080" cy="140" r="6" fill="#f59e0b"/><text x="1080" y="100" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0" fill="#f59e0b">2026</text><text x="1080" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2a4a">ByteFinch</text><text x="1080" y="228" text-anchor="middle" font-size="16" fill="#475569">Founder and CEO</text></g></svg>
