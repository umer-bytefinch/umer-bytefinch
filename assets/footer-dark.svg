<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Small bytes. Big builds. bytefinch.dev">
<title>Small bytes. Big builds. bytefinch.dev</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards;}
.fi{opacity:0;animation:fadeIn .9s ease-out forwards;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center;}
@keyframes draw{to{stroke-dashoffset:0}}

@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes slide2{from{transform:translateX(-600px)}to{transform:translateX(0)}}
</style>
<defs><clipPath id="c"><rect width="1200" height="200" rx="24"/></clipPath>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#1a2a4a"/></linearGradient></defs>
<g clip-path="url(#c)">
<rect width="1200" height="200" fill="url(#bg)"/>
<path d="M0 150 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 V200 H0 Z" fill="#3b82f6" fill-opacity=".22" style="animation:slide 9s linear infinite"/>
<path d="M0 165 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 q75.0 -14 150.0 0 t150.0 0 V200 H0 Z" fill="#3b82f6" fill-opacity=".35" style="animation:slide2 12s linear infinite"/>
<path d="M0 182 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 V200 H0 Z" fill="#1a2a4a" style="animation:slide 7s linear infinite"/>
<path d="M0 182 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0 q75.0 -10 150.0 0 t150.0 0" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-opacity=".8" style="animation:slide 7s linear infinite"/>
<text x="600" y="78" text-anchor="middle" font-size="36" font-weight="800" fill="#f1f5f9" class="fu">Small bytes. <tspan fill="#3b82f6">Big builds.</tspan></text>
<text x="600" y="114" text-anchor="middle" font-size="18" class="mono fu" style="animation-delay:.3s" fill="#94a3b8">bytefinch.dev · Lahore, Pakistan</text>
</g></svg>
