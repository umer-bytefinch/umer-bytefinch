<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Tech stack">
<title>Tech stack</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards;}
.fi{opacity:0;animation:fadeIn .9s ease-out forwards;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center;}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateX(1200px);opacity:0}}
</style>
<defs><linearGradient id="ln" x1="0" x2="1">
<stop offset="0" stop-color="#2563eb"/><stop offset=".35" stop-color="#f59e0b"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient></defs>
<g class="fi">
 <rect x="2" y="22" width="12" height="12" rx="2" fill="#2563eb"/>
 <rect x="18" y="22" width="12" height="12" rx="2" fill="#2563eb" opacity=".55"/>
 <rect x="2" y="38" width="12" height="12" rx="2" fill="#f59e0b"/>
 <rect x="18" y="38" width="12" height="12" rx="2" fill="#2563eb" opacity=".25"/>
</g>
<text x="48" y="50" font-size="34" font-weight="800" fill="#1a2a4a" class="fu" style="animation-delay:.05s">Tech stack</text>
<text x="1198" y="50" text-anchor="end" font-size="17" font-weight="500" fill="#64748b" class="mono fi" style="animation-delay:.3s">~/stack</text>
<rect x="0" y="76" width="1200" height="3" rx="1.5" fill="url(#ln)" opacity=".85"/>
<circle cx="0" cy="77.5" r="4.5" fill="#f59e0b" style="animation:run 6s linear infinite"/>
</svg>
