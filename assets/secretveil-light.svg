<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SecretVeil: the .env file holds a handle, not a value">
<title>SecretVeil: the .env file holds a handle, not a value</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;}
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards;}
.fi{opacity:0;animation:fadeIn .9s ease-out forwards;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes uncover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center;}
@keyframes draw{to{stroke-dashoffset:0}}

@keyframes plain{0%,38%{opacity:1}44%,92%{opacity:0}98%,100%{opacity:1}}
@keyframes veiled{0%,38%{opacity:0}44%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes sweep{0%,30%{transform:translateX(-700px)}46%{transform:translateX(700px)}100%{transform:translateX(700px)}}
@keyframes lbl1{0%,38%{opacity:1}44%,92%{opacity:0}98%,100%{opacity:1}}
.plain{animation:plain 9s ease-in-out infinite}
.veiled{animation:veiled 9s ease-in-out infinite}
.sweep{animation:sweep 9s ease-in-out infinite}
</style>
<defs>
<clipPath id="ed"><rect x="28" y="28" width="640" height="364" rx="16"/></clipPath>
<linearGradient id="veil" x1="0" x2="1">
 <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset=".5" stop-color="#93c5fd" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="418" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<g clip-path="url(#ed)">
<rect x="28" y="28" width="640" height="364" fill="#0f172a"/>
<rect x="28" y="28" width="640" height="46" fill="#ffffff" fill-opacity=".05"/>
<rect x="44" y="40" width="74" height="34" rx="6" fill="#0f172a"/>
<text x="58" y="62" font-size="15" class="mono" fill="#e2e8f0">.env</text>
<circle cx="640" cy="51" r="6" fill="#fbbf24"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
<text x="46" y="124" font-size="15" class="mono" fill="#475569">1</text><text x="78" y="124" font-size="16" class="mono" fill="#64748b"># what your AI agent reads</text><text x="46" y="168" font-size="15" class="mono" fill="#475569">2</text><text x="78" y="168" font-size="16" class="mono" fill="#93c5fd">API_KEY=</text><text x="155" y="168" font-size="16" class="mono plain" fill="#f87171">sk-live-Q9xR2mVn7pLwT4aZ</text><text x="155" y="168" font-size="16" class="mono veiled" fill="#4ade80">sv://api_key</text><text x="46" y="212" font-size="15" class="mono" fill="#475569">3</text><text x="78" y="212" font-size="16" class="mono" fill="#93c5fd">DB_URL=postgres://app:</text><text x="289" y="212" font-size="16" class="mono plain" fill="#f87171">s3cr3t-p4ss<tspan fill="#93c5fd">@db:5432/app</tspan></text><text x="289" y="212" font-size="16" class="mono veiled" fill="#4ade80">sv://db_url_password<tspan fill="#93c5fd">@db:5432/app</tspan></text><text x="46" y="256" font-size="15" class="mono" fill="#475569">4</text><text x="78" y="256" font-size="16" class="mono" fill="#93c5fd">STRIPE_SECRET=</text><text x="212" y="256" font-size="16" class="mono plain" fill="#f87171">rk_live_51Hx9QaT2</text><text x="212" y="256" font-size="16" class="mono veiled" fill="#4ade80">sv://stripe_secret</text><text x="46" y="300" font-size="15" class="mono" fill="#475569">5</text><text x="78" y="300" font-size="16" class="mono" fill="#94a3b8">APP_ENV=production</text><rect class="sweep" x="28" y="74" width="260" height="318" fill="url(#veil)"/><rect x="28" y="348" width="640" height="44" fill="#ffffff" fill-opacity=".04"/><g class="plain"><circle cx="54" cy="370" r="6" fill="#f87171"/><text x="72" y="376" font-size="15" class="mono" fill="#fca5a5">before: the agent can read every secret</text></g><g class="veiled"><circle cx="54" cy="370" r="6" fill="#4ade80"/><text x="72" y="376" font-size="15" class="mono" fill="#86efac">after: the agent reads handles, not values</text></g></g><text x="712" y="86" font-size="42" font-weight="800" class="mono" fill="#1a2a4a">secretveil</text><text x="712" y="124" font-size="19" fill="#475569">Let an AI coding agent work in your repository</text><text x="712" y="150" font-size="19" fill="#475569">without letting it read your secrets.</text><g class="fu" style="animation-delay:0.30s"><circle cx="723" cy="194" r="11" fill="#16a34a" fill-opacity=".15"/><path d="M718 194l4 4 7-8" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="200" font-size="18" fill="#1a2a4a">Nothing to integrate: no plugin, no proxy</text></g><g class="fu" style="animation-delay:0.45s"><circle cx="723" cy="230" r="11" fill="#16a34a" fill-opacity=".15"/><path d="M718 230l4 4 7-8" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="236" font-size="18" fill="#1a2a4a">Filters secrets out of build output</text></g><g class="fu" style="animation-delay:0.60s"><circle cx="723" cy="266" r="11" fill="#16a34a" fill-opacity=".15"/><path d="M718 266l4 4 7-8" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="272" font-size="18" fill="#1a2a4a">Reversible, byte for byte</text></g><g class="fu" style="animation-delay:0.75s"><circle cx="723" cy="302" r="11" fill="#16a34a" fill-opacity=".15"/><path d="M718 302l4 4 7-8" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="744" y="308" font-size="18" fill="#1a2a4a">Local: no account, no network call</text></g><g><rect x="712" y="336" width="54" height="30" rx="15.0" fill="none" fill-opacity="0" stroke="#2563eb" stroke-width="1.5"/><rect x="712" y="336" width="54" height="30" rx="15.0" fill="#2563eb" fill-opacity="0.12"/><text x="739.0" y="356.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">CLI</text></g><g><rect x="776" y="336" width="54" height="30" rx="15.0" fill="none" fill-opacity="0" stroke="#dc2626" stroke-width="1.5"/><rect x="776" y="336" width="54" height="30" rx="15.0" fill="#dc2626" fill-opacity="0.12"/><text x="803.0" y="356.0" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">npm</text></g><g><rect x="840" y="336" width="111" height="30" rx="15.0" fill="none" fill-opacity="0" stroke="#f59e0b" stroke-width="1.5"/><rect x="840" y="336" width="111" height="30" rx="15.0" fill="#f59e0b" fill-opacity="0.12"/><text x="895.5" y="356.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f59e0b">Apache-2.0</text></g><text x="712" y="390" font-size="15" class="mono" fill="#2563eb">github.com/ByteFinch-Technologies/secretveil →</text></svg>
