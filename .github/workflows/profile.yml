# Rebuild the contribution snake and the activity card every day.
# The files go to the `output` branch, and README.md loads them from there.
name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1a2a4a&color_dots=#eef2f7,#bfdbfe,#60a5fa,#2563eb,#1a2a4a
            dist/snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PROFILE_TOKEN is optional. Without it the default token cannot see
      # contributions to private repositories, so the counts can be lower.
      - name: Activity card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 tools/build_activity.py dist ${{ github.repository_owner }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
